<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversa — Chefe Jerry</title><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#080404;color:#EFE7DB;font-family:'Jost',Arial,sans-serif;font-weight:300}
.chatpage{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto;background:#0d0909}
.chathead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#161010;border-bottom:1px solid rgba(255,255,255,.12)}
.chathead a{color:#EFE7DB;text-decoration:none;font-size:22px}
.chathead img{width:44px;height:44px;object-fit:cover;border-radius:50%}
.chathead b{font-family:'Italiana',serif;font-size:20px;letter-spacing:1px;display:block;line-height:1.2}
.chathead span{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.6}
.msgs{flex:1;overflow-y:auto;padding:20px 14px 12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:11px 14px 7px;border-radius:18px;line-height:1.5;font-size:16px}
.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#F0443E,#5c0a0a);border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:#1f1717;border-bottom-left-radius:4px}
.bubble img,.bubble video{max-width:100%;height:auto;border-radius:12px;display:block;margin:4px 0}
.bubble audio{max-width:100%;margin:4px 0}
.bubble .time{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:4px}
.bubble .filelink{color:#fff}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid rgba(255,255,255,.12);background:#161010}
.composer textarea{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#EFE7DB;padding:12px 16px;font-size:16px;font-family:inherit;outline:none;resize:none}
.iconbtn{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:20px;cursor:pointer}
.sendbtn{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:none;background:linear-gradient(135deg,#F0443E,#5c0a0a);color:#fff;font-size:18px;cursor:pointer}
.sendbtn.rec{background:#fff;color:#c00}
.chip{max-width:720px;margin:0 auto;padding:8px 14px;background:#161010;display:none;gap:8px;align-items:center;font-size:14px}
.chip.on{display:flex}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.btn{display:inline-block;margin-top:20px;background:linear-gradient(135deg,#F0443E 0%,#A81212 50%,#2A0303 100%);color:#fff;text-decoration:none;padding:16px 36px;border-radius:999px;font-size:13px;letter-spacing:2.5px;text-transform:uppercase}
</style></head><body>
<div class="chatpage" id="page"></div>
<script>
var KEY='bomapetite_v1';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function account(){try{return JSON.parse(localStorage.getItem(KEY+'_account'))}catch(e){return null}}
function chats(){try{return JSON.parse(localStorage.getItem(KEY+'_chats'))||[]}catch(e){return []}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.chef)return d}catch(e){}return {chef:'Chefe Jerry',city:'Maputo',aboutImg:'media/chefe-jerry-hero.jpg'}}
var DATA=load();var a=account();var page=document.getElementById('page');
if(!a){page.innerHTML='<div class="center"><div><h2 style="font-family:Italiana,serif;font-weight:400;font-size:32px">Fala com o chefe.</h2><p>Entra com a tua conta na secção Contratar para conversares.</p><p><a class="btn" href="index.html#contratar">Criar conta →</a></p></div></div>'}
else{
page.innerHTML='<div class="chathead"><a href="index.html">←</a><img src="'+esc(DATA.aboutImg)+'" alt=""><div><b>'+esc(DATA.chef)+'</b><span>'+esc(DATA.city||'Maputo')+'</span></div></div><div class="msgs" id="msgs"></div><div class="chip" id="chip"><span id="chipname"></span><button type="button" id="chiprm" style="background:none;border:none;color:#fff;cursor:pointer">✕</button></div><div class="composer"><button class="iconbtn" type="button" id="attach" title="Anexar">＋</button><input type="file" id="file" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx"><button class="iconbtn" type="button" id="rec" title="Áudio">🎤</button><textarea id="text" rows="1" placeholder="Mensagem"></textarea><button class="sendbtn" type="button" id="send">➤</button></div>';
var pending=null;var rec=null;var chunks=[];
function time(at){var d=new Date(at||Date.now());return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function attHTML(m){if(!m.attachment)return '';var at=m.attachment;if(at.kind==='image')return '<img src="'+at.url+'" alt="">';if(at.kind==='video')return '<video src="'+at.url+'" controls playsinline></video>';if(at.kind==='audio')return '<audio src="'+at.url+'" controls></audio>';return '<a class="filelink" href="'+at.url+'" download="'+esc(at.name||'ficheiro')+'">📎 '+esc(at.name||'Ficheiro')+'</a>'}
function render(){var list=chats().filter(function(m){return m.email===a.email});var box=document.getElementById('msgs');if(!list.length){box.innerHTML='<p style="text-align:center;opacity:.7">Escreve a tua mensagem. O chefe responde aqui.</p>'}else{box.innerHTML=list.map(function(m){return '<div class="bubble '+(m.from==='admin'?'theirs':'mine')+'">'+attHTML(m)+(m.text?'<span>'+esc(m.text)+'</span>':'')+'<span class="time">'+time(m.at)+'</span></div>'}).join('')}box.scrollTop=box.scrollHeight}
function sendMsg(text,attachment){if(!text&&!attachment)return;var all=chats();all.push({email:a.email,name:a.name,from:'client',text:(text||'').trim(),attachment:attachment||null,at:Date.now()});localStorage.setItem(KEY+'_chats',JSON.stringify(all));pending=null;document.getElementById('chip').classList.remove('on');document.getElementById('text').value='';render()}
document.getElementById('send').onclick=function(){sendMsg(document.getElementById('text').value,pending)};
document.getElementById('text').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(e.target.value,pending)}});
document.getElementById('attach').onclick=function(){document.getElementById('file').click()};
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Ficheiro demasiado grande (máx 5 MB).');e.target.value='';return}var r=new FileReader();r.onload=function(){var kind=f.type.indexOf('image/')===0?'image':f.type.indexOf('video/')===0?'video':f.type.indexOf('audio/')===0?'audio':'file';pending={kind:kind,url:r.result,name:f.name};document.getElementById('chipname').textContent='📎 '+f.name;document.getElementById('chip').classList.add('on')};r.readAsDataURL(f)});
document.getElementById('chiprm').onclick=function(){pending=null;document.getElementById('chip').classList.remove('on')};
document.getElementById('rec').onclick=function(){var btn=document.getElementById('rec');if(rec){rec.stop();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Áudio não disponível neste navegador.');return}navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){chunks=[];rec=new MediaRecorder(stream);btn.classList.add('rec');btn.textContent='■';rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});rec=null;btn.classList.remove('rec');btn.textContent='🎤';var blob=new Blob(chunks,{type:'audio/webm'});var r=new FileReader();r.onload=function(){sendMsg('',{kind:'audio',url:r.result,name:'audio.webm'})};r.readAsDataURL(blob)};rec.start()}).catch(function(){alert('Não foi possível gravar áudio.')})};
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
render();
}
</script></body></html>
